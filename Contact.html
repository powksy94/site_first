<link rel="stylesheet" href="/css/contact.css">
<section id="contact">

  <h1 class="section-header">Contact</h1>

  <div class="contact-wrapper">

    <!-- Left contact page -->


    <form id="contact-form" class="form-horizontal" role="form">

      <div class="form-group">
        <div class="col-sm-12">
          <input type="text" class="form-control" id="name" placeholder="NAME" name="name" value="" required>
        </div>
      </div>

      <div class="form-group">
        <div class="col-sm-12">
          <input type="email" class="form-control" id="email" placeholder="EMAIL" name="email" value="" required>
        </div>
      </div>

      <textarea class="form-control" rows="10" placeholder="MESSAGE" name="message" required></textarea>

      <button class="btn btn-primary send-button" id="submit" type="submit" value="SEND">
        <div class="alt-send-button">
          <i class="fa fa-paper-plane"></i><span class="send-text">SEND</span>


      </button>

    </form>


    <!-- page de connexion droite -->

    <div class="direct-contact-container">

      <ul class="contact-list">
        <li class="list-item"><i class="fa fa-map-marker fa-2x"><span class="contact-text place">📍 City, State</span></i>
        </li>

        <li class="list-item"><i class="fa fa-phone fa-2x"><span class="contact-text phone"><a href="tel:1-212-555-5555"
                title="Give me a call">📞 +33 1 896</a></span></i></li>

        <li class="list-item"><i class="fa fa-envelope fa-2x"><span class="contact-text_gmail"><a href="mailto:#"
                title="Send me an email">✉️ graven.airline@gmail.com</a></span></i></li>

      </ul>

      <hr>
      <ul class="social-media-list">
        <hr>
        <ul class="social-media-list">
          <a href="https://github.com" target="_blank" class="contact-icon">
              <li><img src="/images_logos/GitHub-Logo.png" alt="GitHub" class="social-icon"></li></a>
          
          <a href="https://codepen.io" target="_blank" class="contact-icon">
              <li><img src="/images_logos/code_pen.png" alt="CodePen" class="social-icon"></li></a>
          
          <a href="https://twitter.com" target="_blank" class="contact-icon">
              <li><img src="/images_logos/twitter.jpg" alt="Twitter" class="social-icon"></li></a>
          </li>
          <a href="https://instagram.com" target="_blank" class="contact-icon">
              <li><img src="/images_logos/Instagram_icon.png" alt="Instagram" class="social-icon"></li></a>
        </ul>
        <hr>
        
      </ul>
      <hr>

      <div class="copyright">&copy; ALL OF THE RIGHTS RESERVED</div>

    </div>

  </div>
  <script src="/Js/script/connexion.js"></script>

</section>
